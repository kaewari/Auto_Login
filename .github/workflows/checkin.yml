name: AgentRouter Daily Check-in

on:
  schedule:
    # 03:00 UTC = 12:00 JST (12h trưa Nhật Bản) / 10:00 ICT (10h sáng Việt Nam) mỗi ngày
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Check-in Script
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run checkin

      - name: Upload Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-screenshots
          path: screenshots/
          retention-days: 7
