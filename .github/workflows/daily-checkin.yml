name: AgentRouter Daily Check-in (12:00 PM)

on:
  schedule:
    # 05:00 UTC = 12:00 PM ICT (12h trưa Việt Nam) / 14:00 JST mỗi ngày
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  checkin:
    name: Auto Check-in 12:00 PM
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Auto Check-in & Screenshot
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run checkin

      - name: Upload Screenshots Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-screenshots-12pm
          path: screenshots/
          retention-days: 7
